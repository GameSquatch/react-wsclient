name: Deploy static site to Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Up Env
        uses: pnpm/setup@v3
        with:
          version: ^12.0.0
          runtime: node@24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build demo site
        run: pnpm --filter "./packages/app" run build
      - name: Run Tests
        run: pnpm --filter "./packages/react-wsclient" run test
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './packages/app/dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
